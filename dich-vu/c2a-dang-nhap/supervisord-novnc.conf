; Cấu hình supervisord cho c2a-dang-nhap khi BẬT noVNC (chạy dưới appuser không root)
[supervisord]
nodaemon=true
user=appuser
pidfile=/tmp/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ── Màn hình ảo Xvfb & Fluxbox ─────────────────────────────────────────────────
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1366x768x24 -ac +extension RANDR
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── VNC server (bắt buộc mật khẩu từ tệp /khoa/mat-khau-vnc, không -nopw, nghe 127.0.0.1) ───────
[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -passwdfile /khoa/mat-khau-vnc -forever -shared -rfbport 5900 -listen 127.0.0.1 -quiet
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── noVNC websocket proxy (cổng 6080, chỉ nghe 127.0.0.1 nội bộ container) ──────────────────────────────────────────
[program:novnc]
command=/usr/bin/websockify --web=/usr/share/novnc/ 127.0.0.1:6080 127.0.0.1:5900
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── API captcha-solver (FastAPI/uvicorn nghe 0.0.0.0:8010 trong mạng nội bộ Docker) ──
[program:captcha-api]
command=uvicorn src.main:app --host 0.0.0.0 --port 8010 --workers 1
directory=/app
environment=DISPLAY=":99",PYTHONPATH="/app"
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
