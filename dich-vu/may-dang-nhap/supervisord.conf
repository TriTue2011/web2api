; Cấu hình supervisord cho may-dang-nhap (chạy dưới appuser không root)
[supervisord]
nodaemon=true
user=appuser
pidfile=/tmp/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ── Màn hình ảo Xvfb & Fluxbox ─────────────────────────────────────────────────
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1366x768x24 -ac +extension RANDR
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── API captcha-solver (FastAPI/uvicorn nghe 0.0.0.0:8010 trong mạng nội bộ Docker) ──
[program:captcha-api]
command=uvicorn src.main:app --host 0.0.0.0 --port 8010 --workers 1
directory=/app
environment=DISPLAY=":99",PYTHONPATH="/app"
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
