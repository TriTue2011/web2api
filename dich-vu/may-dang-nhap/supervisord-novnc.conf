; Cấu hình supervisord cho may-dang-nhap khi BẬT noVNC (chạy dưới appuser không root)
[supervisord]
nodaemon=true
user=appuser
pidfile=/tmp/supervisord.pid
logfile=/dev/stdout
logfile_maxbytes=0

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

; ── Màn hình ảo Xvfb & Fluxbox ─────────────────────────────────────────────────
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1366x768x24 -ac +extension RANDR
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── VNC server (bắt buộc mật khẩu từ tệp /khoa/mat-khau-vnc, không -nopw, nghe 127.0.0.1) ───────
; CAPTCHA_SOLVER_NOVNC_MAT_KHAU=0 (đặt ở tệp ghi đè CỤC BỘ của máy chủ, không phải trong repo): bỏ mật khẩu để lõi web2api xem được
; màn hình qua đường có vé (/novnc/…) mà không bắt người xem gõ mật khẩu. x11vnc VẪN chỉ nghe 127.0.0.1 trong container; chỉ
; websockify (bên dưới) ra mạng nội bộ Docker, nên chỉ dùng khi mạng đó chỉ có web2api và dịch vụ này. Mặc định: BẮT BUỘC mật khẩu.
[program:x11vnc]
command=/bin/sh -c 'if [ "$CAPTCHA_SOLVER_NOVNC_MAT_KHAU" = "0" ]; then exec /usr/bin/x11vnc -display :99 -nopw -forever -shared -rfbport 5900 -listen 127.0.0.1 -quiet; else exec /usr/bin/x11vnc -display :99 -passwdfile /khoa/mat-khau-vnc -forever -shared -rfbport 5900 -listen 127.0.0.1 -quiet; fi'
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── noVNC websocket proxy (cổng 6080, chỉ nghe 127.0.0.1 nội bộ container) ──────────────────────────────────────────
; CAPTCHA_SOLVER_NOVNC_NGHE=0.0.0.0 (tệp ghi đè cục bộ): nghe trên giao diện mạng của container để web2api tới được qua mạng nội bộ
; Docker; mặc định 127.0.0.1. KHÔNG công bố cổng ra máy chủ (compose chỉ expose).
[program:novnc]
command=/bin/sh -c 'exec /usr/bin/websockify --web=/usr/share/novnc/ "${CAPTCHA_SOLVER_NOVNC_NGHE:-127.0.0.1}:6080" 127.0.0.1:5900'
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── API captcha-solver (FastAPI/uvicorn nghe 0.0.0.0:8010 trong mạng nội bộ Docker) ──
[program:captcha-api]
command=uvicorn src.main:app --host 0.0.0.0 --port 8010 --workers 1
directory=/app
environment=DISPLAY=":99",PYTHONPATH="/app"
autorestart=true
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
