<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>web2api</title>
<link rel="stylesheet" href="./khung.css">
<script src="./khung.js"></script>
</head>
<body>
<!-- Địa chỉ gốc «/»: kiểm tra thiết lập ban đầu (chưa có admin → Thiết lập), kiểm tra phiên
     (chưa đăng nhập → Đăng nhập), đã đăng nhập → trang đầu theo tính năng đang có. -->
<main class="goc" style="align-items:center;justify-content:center;padding:24px;box-sizing:border-box">
<p role="status" id="tt">Đang mở web2api… Nếu trang không tự chuyển, mở <a href="Dang-nhap.dc.html">Đăng nhập</a>.</p>
</main>
<script>
(async () => {
  try {
    const resTl = await fetch('api/thiet-lap', { cache: 'no-store' });
    if (resTl.ok) {
      const jTl = await resTl.json();
      if (jTl && jTl.can_thiet_lap) {
        location.replace('Thiet-lap.dc.html');
        return;
      }
    }
  } catch (e) {
    // Tiếp tục kiểm tra phiên
  }

  try {
    const tn = await Khung.taiTinhNang();
    location.replace(Khung.trangDau(tn));
  } catch (err) {
    if (err && err.ma === 401) {
      location.replace('Dang-nhap.dc.html');
    } else if (err && err.ma === 403) {
      // 403 = đã đăng nhập nhưng không phải quản trị: đưa tới trang tự phục vụ (khoá/mật khẩu của chính mình).
      location.replace('He-thong-Bao-mat.dc.html');
    } else {
      // Lỗi tạm (500, 503, 429, đứt mạng...): ở lại trang «/», hiện thông báo kèm nút «Thử lại»
      const tt = document.getElementById('tt');
      if (tt) {
        tt.setAttribute('role', 'alert');
        tt.textContent = '';
        const msg = document.createElement('span');
        msg.textContent = (err && err.message) || 'Không thể kết nối máy chủ.';
        const btn = document.createElement('button');
        btn.textContent = 'Thử lại';
        btn.onclick = () => location.reload();
        btn.style.marginLeft = '12px';
        tt.appendChild(msg);
        tt.appendChild(btn);
      }
    }
  }
})();
</script>
</body>
</html>
