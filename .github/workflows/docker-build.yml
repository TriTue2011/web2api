name: Publish Docker Image

# Dựng ảnh web2api đa kiến trúc (amd64 + arm64) và đẩy lên GHCR sau khi bộ test đạt.
#
# LƯU Ý CHO CHỦ KHO — làm MỘT LẦN sau lần chạy đầu tiên thành công:
#   gói ghcr.io/tritue2011/web2api mặc định là RIÊNG TƯ dù kho GitHub là public. Vào trang
#   Packages của chủ kho → chọn gói web2api → Package settings → Change visibility → Public.
#   Chưa đặt public thì người khác `docker pull` sẽ bị từ chối. Quy trình này không tự làm được
#   việc đó (GITHUB_TOKEN không có quyền đổi chế độ hiển thị của gói).

# Kích hoạt khi đẩy lên main (mã nguồn đổi) VÀ khi gắn thẻ phát hành v*.
on:
  push:
    branches:
      - main
    # Chỉ tài liệu đổi thì không dựng lại ảnh: ảnh chỉ chứa app/ và web/ (xem .dockerignore,
    # *.md bị loại trừ), nên sửa README hay docs/ không làm ảnh khác đi.
    paths-ignore:
      - "**.md"
      - "docs/**"
    tags:
      - "v*"
  workflow_dispatch:

# Mỗi nhánh/thẻ chỉ một lượt dựng: đẩy dồn dập nhiều commit thì lượt cũ bị HUỶ (trạng thái
# «cancelled», không phải «failure») và chỉ commit mới nhất dựng tới cùng. Không có nhóm này, các
# lượt chạy song song cùng đẩy ảnh lên GHCR một lúc, tranh chấp registry và có lượt nhận
# `denied: 403 Forbidden` ở bước đẩy (đã đo ở kho chatgpt2api ngày 07/08/2026).
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

# Quyền tối thiểu mặc định cho cả file; job nào cần đẩy ảnh tự xin thêm `packages: write`.
permissions:
  contents: read

env:
  # Tham chiếu GHCR bắt buộc chữ thường; github.repository_owner là «TriTue2011» (có chữ hoa)
  # sẽ làm push-by-digest lỗi «repository name must be lowercase». Nên ghi cứng chủ kho đã hạ chữ.
  REGISTRY_IMAGE: ghcr.io/tritue2011/web2api

jobs:
  # CỔNG 1 — test chạy TRƯỚC khi dựng ảnh: test đỏ thì không có ảnh nào được đẩy lên GHCR.
  # Mọi test dùng máy chủ giả cục bộ (không gọi Internet). Test giao diện cần Chrome và node, đều
  # có sẵn trên runner ubuntu-latest; phần so với trang demo thiết kế tự bỏ qua vì kho này không
  # chứa các trang demo đó (không đặt WEB2API_DEMO_DIR).
  test:
    runs-on: ubuntu-latest
    # 20 phút là dư: bộ test nhỏ, phần tốn thời gian chỉ là cài gói và khởi động Chrome. Đặt
    # trần để runner treo không ngốn hết giờ miễn phí.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt

      # CỔNG RIÊNG CHO THẺ PHÁT HÀNH: thẻ v0.2.0 mà tệp VERSION còn ghi 0.1.0 thì ảnh sẽ mang
      # nhãn phiên bản sai. Bắt ở đây, trước khi tốn thời gian dựng hai kiến trúc.
      - name: Check release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          THE_PHAT_HANH: ${{ github.ref_name }}
        run: |
          phien_ban="$(tr -d '[:space:]' < VERSION)"
          if [ "v${phien_ban#v}" != "$THE_PHAT_HANH" ]; then
            echo "::error::Thẻ $THE_PHAT_HANH không khớp tệp VERSION ($phien_ban) — sửa VERSION rồi gắn lại thẻ."
            exit 1
          fi

      - name: Run tests
        run: python -m pytest test -q

  # Mỗi kiến trúc dựng trên runner BẢN ĐỊA của nó (nhanh, không giả lập QEMU). arm64 dùng runner
  # arm64 miễn phí của GitHub cho kho public. Mỗi chân chỉ đẩy ảnh THEO DIGEST (chưa có thẻ nào);
  # job `merge` ghép các digest thành một manifest đa kiến trúc rồi mới gắn thẻ.
  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      # Một chân hỏng không huỷ chân kia, để thấy rõ chân nào lỗi; `merge` vẫn không chạy nếu
      # có chân hỏng (needs yêu cầu cả ma trận thành công).
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # GITHUB_TOKEN của chính lượt chạy là đủ để đẩy lên gói của kho này; không cần bí mật nào khác.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # CỔNG CUỐI — ghép digest hai kiến trúc thành một manifest với thẻ thật. Chỉ chạy khi CẢ HAI
  # chân build thành công, nên một chân arm64 hỏng không bao giờ ghi đè `latest` đang chạy tốt.
  #
  # Các thẻ:
  #   sha-<7 ký tự đầu của commit>  mọi lượt (truy ngược ảnh về đúng commit)
  #   <phiên bản>                   đọc từ tệp VERSION (bỏ chữ «v» đầu nếu có: v0.1.0-khung → 0.1.0-khung);
  #                                 chỉ trên main và thẻ v*, để lượt chạy tay trên nhánh phụ không
  #                                 cướp mất nhãn phiên bản của bản đã phát hành
  #   latest                        CHỈ khi chạy trên nhánh main
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Cần mã nguồn để đọc tệp VERSION.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest and push
        run: |
          set -euo pipefail
          phien_ban="$(tr -d '[:space:]' < VERSION)"
          phien_ban="${phien_ban#v}"
          # Thẻ Docker chỉ nhận chữ, số, «_», «.», «-» và không được bắt đầu bằng «.» hay «-»:
          # VERSION viết sai thì dừng với lời nhắn rõ, thay vì để buildx báo lỗi khó hiểu.
          if ! [[ "$phien_ban" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Tệp VERSION ('$phien_ban') không dùng được làm thẻ Docker."
            exit 1
          fi

          the=(-t "${REGISTRY_IMAGE}:sha-${GITHUB_SHA::7}")
          if [ "$GITHUB_REF" = "refs/heads/main" ] || [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            the+=(-t "${REGISTRY_IMAGE}:${phien_ban}")
          fi
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            the+=(-t "${REGISTRY_IMAGE}:latest")
          fi

          nguon=()
          for digest in /tmp/digests/*; do
            nguon+=("${REGISTRY_IMAGE}@sha256:$(basename "$digest")")
          done

          docker buildx imagetools create "${the[@]}" "${nguon[@]}"
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:sha-${GITHUB_SHA::7}"
